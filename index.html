<!doctype html>
<html lang="nl" data-vite-mode="%MODE%">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>De Lichtvallei</title>
  <script>
    if (document.documentElement.dataset.viteMode.startsWith('%')) {
      const buildUrl = new URL('./dist/', window.location.href);
      buildUrl.search = window.location.search;
      buildUrl.hash = window.location.hash;
      window.location.replace(buildUrl);
    }
  </script>
</head>
<body>
  <main>
    <h1>De Lichtvallei</h1>
    <p id="course-guide">Sla om de wortel heen of spring erover via de paarse paddenstoel.</p>
    <p>Stel een roomscale-grens in op je Quest om fysiek te stappen.</p>
    <p id="score" aria-live="polite">0 slagen</p>
    <p id="putter-guide">Houd grip vast om de putter af te stellen.</p>
    <a id="room-mode" href="?room=1">Kamerbaan met passthrough</a>
    <a id="mode" href="?practice=1">Naar de oefenbaan</a>
    <button id="reset" type="button">Opnieuw spelen</button>
    <button id="sound" type="button">Geluid uit</button>
  </main>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
